name: spm

on:
  push:
  pull_request:

jobs:
  swift-build-run:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v2
    - name: Build
      run: swift build

  cocoapods:
      strategy:
          matrix:
            platform: [ios, tvos, macos, watchos]
      runs-on: macOS-latest
      steps:
      - uses: actions/checkout@v2
      - name: Build
        run: pod lib lint leveldb-library.podspec --platforms=${{ matrix.platform }}  --no-clean --skip-import-validation
